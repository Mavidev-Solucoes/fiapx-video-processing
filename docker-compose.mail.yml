# Local development and FIAP demonstration only. Mailpit captures email
# instead of sending it to the public internet.
# docker compose -f docker-compose.yml -f docker-compose.mail.yml --profile monitoring up -d --build
services:
  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
    volumes:
      - mailpit-data:/data
    ports:
      - "127.0.0.1:8025:8025"

  api:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: "notifications@fiapx.test"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_ALLOW_PLAINTEXT: "true"

volumes:
  mailpit-data:
