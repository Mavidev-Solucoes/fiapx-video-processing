name: fiapx

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fiapx
      POSTGRES_USER: fiapx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiapx-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiapx -d fiapx"]
      interval: 5s
      timeout: 5s
      retries: 12

  schema-migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-fiapx-local-only}
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-ec", "psql -h postgres -U fiapx -d fiapx -v ON_ERROR_STOP=1 -f /migrations/002_job_outbox.sql && psql -h postgres -U fiapx -d fiapx -v ON_ERROR_STOP=1 -f /migrations/003_worker_leases.sql && psql -h postgres -U fiapx -d fiapx -v ON_ERROR_STOP=1 -f /migrations/004_notifications.sql"]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: fiapx
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fiapx-local-only}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-fiapx}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-fiapx-local-only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-fiapx}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-fiapx-local-only}
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
      mc mb --ignore-existing local/fiapx-videos;
      '

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9091"
      DATABASE_URL: "postgres://fiapx:${POSTGRES_PASSWORD:-fiapx-local-only}@postgres:5432/fiapx?sslmode=disable"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:-fiapx-local-development-jwt-secret-change-this-before-deployment}"
      RABBITMQ_URL: "amqp://fiapx:${RABBITMQ_PASSWORD:-fiapx-local-only}@rabbitmq:5672/"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "fiapx-videos"
      S3_ACCESS_KEY: "${MINIO_USER:-fiapx}"
      S3_SECRET_KEY: "${MINIO_PASSWORD:-fiapx-local-only}"
    expose:
      - "9091"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      schema-migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    environment:
      DATABASE_URL: "postgres://fiapx:${POSTGRES_PASSWORD:-fiapx-local-only}@postgres:5432/fiapx?sslmode=disable"
      RABBITMQ_URL: "amqp://fiapx:${RABBITMQ_PASSWORD:-fiapx-local-only}@rabbitmq:5672/"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "fiapx-videos"
      S3_ACCESS_KEY: "${MINIO_USER:-fiapx}"
      S3_SECRET_KEY: "${MINIO_PASSWORD:-fiapx-local-only}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      schema-migrate:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
      - rabbitmq

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-fiapx-monitoring-local}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
  prometheus-data:
  grafana-data:
