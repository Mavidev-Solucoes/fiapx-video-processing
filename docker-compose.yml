name: fiapx

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fiapx
      POSTGRES_USER: fiapx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiapx-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiapx -d fiapx"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: fiapx
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fiapx-local-only}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-fiapx}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-fiapx-local-only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${POSTGRES_PASSWORD:-fiapx-local-only}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-fiapx-local-only}
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
      mc mb --ignore-existing local/fiapx-videos;
      '

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://fiapx:${POSTGRES_PASSWORD:-fiapx-local-only}@postgres:5432/fiapx?sslmode=disable"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:-fiapx-local-development-jwt-secret-change-this-before-deployment}"
      RABBITMQ_URL: "amqp://fiapx:${RABBITMQ_PASSWORD:-fiapx-local-only}@rabbitmq:5672/"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "fiapx-videos"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    environment:
      DATABASE_URL: "postgres://fiapx:${POSTGRES_PASSWORD:-fiapx-local-only}@postgres:5432/fiapx?sslmode=disable"
      RABBITMQ_URL: "amqp://fiapx:${RABBITMQ_PASSWORD:-fiapx-local-only}@rabbitmq:5672/"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "fiapx-videos"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
