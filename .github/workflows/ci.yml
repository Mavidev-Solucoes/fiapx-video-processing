name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go build, vet and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Download and capture dependency checksums for PR
        run: |
          go mod tidy
          echo "__MODULE_BEGIN__"
          cat go.mod
          echo "__MODULE_END__"
          echo "__SUM_BEGIN__"
          cat go.sum
          echo "__SUM_END__"
          for file in $(gofmt -l cmd internal); do
            echo "__FILE_BEGIN__:$file"
            gofmt "$file"
            echo "__FILE_END__:$file"
          done
          gofmt -w cmd internal
      - name: gofmt
        run: |
          test -z "$(gofmt -l cmd internal)"
      - name: Build
        run: go build ./cmd/api ./cmd/worker
      - name: Vet
        run: go vet ./...
      - name: Tests (race detector)
        run: go test -race ./...

  containers:
    name: Docker and Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build API image
        run: docker build -f deploy/Dockerfile.api -t fiapx-api:ci .
      - name: Build worker image
        run: docker build -f deploy/Dockerfile.worker -t fiapx-worker:ci .
