name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go build, vet and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Download module dependencies
        run: go mod download
      - name: gofmt
        run: |
          test -z "$(gofmt -l cmd internal)"
      - name: Check browser JavaScript syntax
        run: node --check internal/httpapi/ui/app.js
      - name: Build
        run: go build ./cmd/api ./cmd/worker
      - name: Vet
        run: go vet ./...
      - name: Tests (race detector)
        run: go test -race ./...

  containers:
    name: Docker and Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.release.yml config --quiet
      - name: Build API image
        run: docker build -f deploy/Dockerfile.api -t fiapx-api:ci .
      - name: Build worker image
        run: docker build -f deploy/Dockerfile.worker -t fiapx-worker:ci .

  intake:
    name: Integration smoke - durable video intake
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run Compose upload and broker-recovery smoke test
        run: bash scripts/smoke-intake.sh

  processing:
    name: E2E - FFmpeg, ZIP and user isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run two-worker processing and download smoke test
        run: bash scripts/smoke-processing.sh

